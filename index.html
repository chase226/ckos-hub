<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CKOS Mission Control</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#282e39">
<link rel="icon" href="assets/k-navy.svg">
<link rel="apple-touch-icon" href="assets/k-navy.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mission Control">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#282E39;
       color:#F5F5F3;min-height:100vh;min-height:100dvh;display:flex;align-items:center;
       justify-content:center;padding:24px}
  .card{width:100%;max-width:380px;text-align:center}
  .mark{height:52px;margin-bottom:26px;opacity:.95}
  .eyebrow{font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
           color:#769FB6;margin-bottom:10px}
  h1{font-family:'Montserrat',sans-serif;font-weight:300;font-size:31px;letter-spacing:-.03em;
     margin-bottom:10px}
  .sub{font-size:14px;color:#BCBDBE;line-height:1.6;margin-bottom:26px}
  input[type=password]{width:100%;padding:15px 16px;font-size:16px;font-family:inherit;
    background:#323845;border:1px solid #454b58;color:#F5F5F3;border-radius:2px;
    letter-spacing:.04em;-webkit-appearance:none}
  input[type=password]:focus{outline:none;border-color:#769FB6;background:#363d4b}
  input::placeholder{color:#7B8090}
  button{width:100%;margin-top:11px;padding:15px 16px;font-size:14px;font-weight:600;
    font-family:inherit;letter-spacing:.1em;text-transform:uppercase;background:#769FB6;
    color:#181818;border:none;border-radius:2px;cursor:pointer;-webkit-appearance:none}
  button:hover{background:#89b0c5}
  button:disabled{opacity:.55;cursor:default}
  .remember{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:16px;
    font-size:13px;color:#BCBDBE;cursor:pointer;user-select:none}
  .remember input{width:16px;height:16px;accent-color:#769FB6;cursor:pointer}
  .err{margin-top:15px;font-size:13.5px;color:#E2938C;min-height:19px;line-height:1.5}
  .foot{margin-top:30px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    color:#6B7080;line-height:1.9}
</style>
</head>
<body>

<div class="card">
  <img class="mark" src="assets/k-navy.svg" alt="">
  <div class="eyebrow">CKOS</div>
  <h1>Mission Control</h1>
  <p class="sub">Business and life, one page.<br>Private. Enter your passcode.</p>

  <form id="gate" autocomplete="off">
    <input type="password" id="pc" placeholder="Passcode" autocomplete="current-password"
           autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <button type="submit" id="go">Unlock</button>
    <label class="remember">
      <input type="checkbox" id="remember" checked>
      Stay unlocked on this device
    </label>
  </form>

  <div class="err" id="err" role="alert"></div>
  <div class="foot">AES-256-GCM &middot; encrypted at rest<br>The Kincer Group</div>
</div>

<script>
const KEY = 'ckos.hub.pc';
const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function deriveKey(passcode, salt, iterations) {
  const base = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(passcode), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
}

// The lock chip rides along inside the decrypted page so there is always a
// one-tap way to forget the passcode on a shared or lost device.
const LOCK_CHIP = `
<style>
  #ckos-lock{position:fixed;right:14px;bottom:14px;z-index:99999;
    font:600 10px/1 'Inter',-apple-system,sans-serif;letter-spacing:.14em;
    text-transform:uppercase;background:#282E39;color:#F5F5F3;border:none;
    padding:11px 15px;border-radius:2px;cursor:pointer;opacity:.5;
    box-shadow:0 2px 10px rgba(40,46,57,.3)}
  #ckos-lock:hover{opacity:1}
  @media print{#ckos-lock{display:none}}
</style>
<button id="ckos-lock" onclick="localStorage.removeItem('ckos.hub.pc');location.reload()">Lock</button>
`;

async function unlock(passcode, remember) {
  const res = await fetch('data/hub.enc.json?t=' + Date.now(), { cache: 'no-store' });
  if (!res.ok) throw new Error('Could not load the encrypted page.');
  const blob = await res.json();

  const key = await deriveKey(passcode, b64(blob.kdf.salt), blob.kdf.iterations);
  // GCM authenticates: a wrong passcode throws here rather than returning garbage.
  const plain = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: b64(blob.iv) }, key, b64(blob.ct));

  const payload = JSON.parse(new TextDecoder().decode(plain));
  if (remember) localStorage.setItem(KEY, passcode);

  const html = payload.html.replace('</body>', LOCK_CHIP + '</body>');
  document.open();
  document.write(html);
  document.close();
}

$('gate').addEventListener('submit', async e => {
  e.preventDefault();
  const pc = $('pc').value.trim();
  if (!pc) return;
  $('go').disabled = true;
  $('err').textContent = '';
  try {
    await unlock(pc, $('remember').checked);
  } catch (err) {
    localStorage.removeItem(KEY);
    $('err').textContent = /load/i.test(err.message)
      ? err.message
      : 'That passcode did not work.';
    $('go').disabled = false;
    $('pc').select();
  }
});

// Saved passcode: unlock straight through, no interaction.
(async () => {
  const saved = localStorage.getItem(KEY);
  if (!saved) return;
  try { await unlock(saved, true); }
  catch { localStorage.removeItem(KEY); }
})();
</script>
</body>
</html>
